[project]
name = "tambooh"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.45,<1", "httpx>=0.27,<1", "pdfplumber>=0.11,<1", "boto3>=1.34,<2", "pydantic>=2.7,<3", "aws-lambda-powertools>=2.40,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

