name: Deploy dev
on:
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-dev
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DEPLOY_ENV: dev
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      AWS_ARTIFACTS_BUCKET: ${{ vars.AWS_ARTIFACTS_BUCKET || 'tambooh-dev-artifacts-786638967830' }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN || 'arn:aws:iam::786638967830:role/tambooh-dev-cloudformation' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::786638967830:role/tambooh-dev-github-deploy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployment prerequisites
        run: |
          : "${AWS_DEPLOY_ROLE_ARN:?Set the GitHub environment variable AWS_DEPLOY_ROLE_ARN}"
          command -v make
          command -v rsync
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Inspect OIDC claims (no credentials logged)
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setSecret(token);
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            const safe = Object.fromEntries(
              ['iss', 'aud', 'sub', 'repository', 'repository_id', 'repository_owner_id', 'ref', 'environment']
                .filter(key => claims[key] !== undefined)
                .map(key => [key, claims[key]])
            );
            core.info(JSON.stringify(safe, null, 2));
            await core.summary.addHeading('OIDC claims for AWS bootstrap')
              .addCodeBlock(JSON.stringify(safe, null, 2), 'json').write();
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
      - name: Build and deploy
        run: bash scripts/deploy.sh "$DEPLOY_ENV"
