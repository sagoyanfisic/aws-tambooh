name: Deploy dev
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy-dev
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DEPLOY_ENV: dev
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      AWS_ARTIFACTS_BUCKET: ${{ vars.AWS_ARTIFACTS_BUCKET || 'tambooh-dev-artifacts-786638967830' }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN || 'arn:aws:iam::786638967830:role/tambooh-dev-keys-cloudformation' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployment prerequisites
        run: |
          : "${AWS_CLOUDFORMATION_ROLE_ARN:?Set AWS_CLOUDFORMATION_ROLE_ARN from the access-key bootstrap outputs}"
          command -v make
          command -v rsync
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Configure AWS credentials from dev secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true
      - name: Verify deployment account and role
        run: bash scripts/check-deploy-target.sh
      - uses: aws-actions/setup-sam@v2
      - name: Build and deploy
        run: bash scripts/deploy.sh "$DEPLOY_ENV"
