name: Deploy dev
on:
  workflow_dispatch:
    inputs:
      execute_changeset:
        description: Execute the change set (disable to review it without changing resources)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: deploy-dev
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DEPLOY_ENV: dev
      SAM_EXECUTE_CHANGESET: ${{ inputs.execute_changeset && 'true' || 'false' }}
      AWS_RAW_DATA_BUCKET_NAME: ${{ vars.AWS_RAW_DATA_BUCKET_NAME }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      AWS_ARTIFACTS_BUCKET: ${{ vars.AWS_ARTIFACTS_BUCKET || 'tambooh-dev-artifacts-786638967830' }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN || 'arn:aws:iam::786638967830:role/tambooh-dev-keys-cloudformation' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployment prerequisites
        run: |
          : "${AWS_CLOUDFORMATION_ROLE_ARN:?Set AWS_CLOUDFORMATION_ROLE_ARN from the access-key bootstrap outputs}"
          command -v make
          command -v rsync
      - name: Check required dev secrets
        env:
          DEPLOY_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          DEPLOY_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$DEPLOY_ACCESS_KEY_ID" ] || [ -z "$DEPLOY_SECRET_ACCESS_KEY" ]; then
            echo "::error::Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY under Settings > Environments > dev > Environment secrets. Variables are not secrets."
            exit 1
          fi
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Configure AWS credentials from dev secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true
      - name: Verify deployment account and role
        run: bash scripts/check-deploy-target.sh
      - uses: aws-actions/setup-sam@v2
      - name: Build and deploy
        run: bash scripts/deploy.sh "$DEPLOY_ENV"
      - uses: actions/setup-node@v4
        if: inputs.execute_changeset
        with:
          node-version: '22'
      - name: Build and publish frontend
        if: inputs.execute_changeset
        run: python scripts/deploy_frontend.py "$DEPLOY_ENV"
