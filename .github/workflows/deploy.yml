name: Deploy TamBooh
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        required: true
        default: dev
        options: [dev, prod]
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'dev' }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      AWS_ARTIFACTS_BUCKET: ${{ vars.AWS_ARTIFACTS_BUCKET || (inputs.environment == 'dev' && 'tambooh-dev-artifacts-786638967830' || '') }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::786638967830:role/tambooh-dev-cloudformation' || '') }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::786638967830:role/tambooh-dev-github-deploy' || '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployment prerequisites
        run: |
          : "${AWS_DEPLOY_ROLE_ARN:?Set the GitHub environment variable AWS_DEPLOY_ROLE_ARN}"
          command -v make
          command -v rsync
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
      - name: Build and deploy
        run: bash scripts/deploy.sh "$DEPLOY_ENV"
