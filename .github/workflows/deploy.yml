name: Deploy TamBooh
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        required: true
        default: dev
        options: [dev, prod]
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'dev' }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      AWS_ARTIFACTS_BUCKET: ${{ vars.AWS_ARTIFACTS_BUCKET || (inputs.environment == 'dev' && 'tambooh-dev-artifacts-786638967830' || '') }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::786638967830:role/tambooh-dev-keys-cloudformation' || '') }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || (inputs.environment == 'dev' && 'arn:aws:iam::786638967830:role/tambooh-dev-github-deploy' || '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployment prerequisites
        run: |
          if [ "$DEPLOY_ENV" = prod ]; then
            : "${AWS_DEPLOY_ROLE_ARN:?Set the production AWS_DEPLOY_ROLE_ARN}"
          fi
          : "${AWS_CLOUDFORMATION_ROLE_ARN:?Set AWS_CLOUDFORMATION_ROLE_ARN from the bootstrap outputs}"
          command -v make
          command -v rsync
      - name: Check required dev secrets
        if: inputs.environment == 'dev'
        env:
          DEPLOY_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          DEPLOY_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$DEPLOY_ACCESS_KEY_ID" ] || [ -z "$DEPLOY_SECRET_ACCESS_KEY" ]; then
            echo "::error::Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY under Settings > Environments > dev > Environment secrets. Variables are not secrets."
            exit 1
          fi
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Inspect OIDC claims (no credentials logged)
        if: inputs.environment == 'prod'
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setSecret(token);
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            const safe = Object.fromEntries(
              ['iss', 'aud', 'sub', 'repository', 'repository_id', 'repository_owner_id', 'ref', 'environment']
                .filter(key => claims[key] !== undefined)
                .map(key => [key, claims[key]])
            );
            core.info(JSON.stringify(safe, null, 2));
            await core.summary.addHeading('OIDC claims for AWS bootstrap')
              .addCodeBlock(JSON.stringify(safe, null, 2), 'json').write();
      - name: Configure AWS credentials from dev secrets
        if: inputs.environment == 'dev'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true
      - name: Configure production OIDC credentials
        if: inputs.environment == 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify deployment account and role
        run: bash scripts/check-deploy-target.sh
      - uses: aws-actions/setup-sam@v2
      - name: Build and deploy
        run: bash scripts/deploy.sh "$DEPLOY_ENV"
