name: Deploy prod
on:
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_ENV: prod
      AWS_RAW_DATA_BUCKET_NAME: ${{ vars.AWS_RAW_DATA_BUCKET_NAME }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      AWS_ARTIFACTS_BUCKET: ${{ vars.AWS_ARTIFACTS_BUCKET }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployment prerequisites
        run: |
          : "${AWS_DEPLOY_ROLE_ARN:?Set the GitHub environment variable AWS_DEPLOY_ROLE_ARN}"
          command -v make
          command -v rsync
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify deployment account and role
        run: bash scripts/check-deploy-target.sh
      - uses: aws-actions/setup-sam@v2
      - name: Build and deploy
        run: bash scripts/deploy.sh "$DEPLOY_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and publish frontend
        run: python scripts/deploy_frontend.py "$DEPLOY_ENV"
