# Replace placeholders with immutable owner/repository/environment identifiers.
Version: '2012-10-17'
Statement:
  - Effect: Allow
    Principal: {Federated: arn:aws:iam::<ACCOUNT_ID>:oidc-provider/token.actions.githubusercontent.com}
    Action: sts:AssumeRoleWithWebIdentity
    Condition:
      StringEquals:
        token.actions.githubusercontent.com:aud: sts.amazonaws.com
        token.actions.githubusercontent.com:sub: repo:<OWNER_ID>/<REPOSITORY_ID>:environment:<ENVIRONMENT_ID>

